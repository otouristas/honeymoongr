# Netlify detects Next.js and applies the OpenNext adapter automatically.
# The adapter is deliberately not pinned in package.json so it keeps pace with
# Next releases — see https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Self-hosted fonts are content-hashed by filename and never change in place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.deploy-preview]
  [context.deploy-preview.environment]
    # Previews must never be indexed alongside the canonical domain.
    NEXT_PUBLIC_NOINDEX = "1"

[context.branch-deploy]
  [context.branch-deploy.environment]
    NEXT_PUBLIC_NOINDEX = "1"
